name: Gate

# The real gate — lint, type-check, the full test suite, and the build — running
# on a hosted runner. This is what the Glaze tree could not do: `@glaze/core`
# resolved to the Glaze.app SDK install outside the repo, so every one of these
# commands failed there for reasons unrelated to the change under review, and
# the merge gate was a checkbox in the pull request template instead.
#
# This branch has no dependency outside node_modules, so all of it runs here.

on:
  push:
    branches: [main, shell/electron]
  pull_request:
  workflow_dispatch:

# A new push to the same ref makes the in-flight run irrelevant. Without this,
# a branch pushed three times in a minute holds three macOS runners.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Ubuntu on purpose: macOS runner minutes bill at roughly ten times the Linux
  # rate, and nothing in this job is platform-specific — there is no
  # `process.platform` branch anywhere under main/, renderer/ or mcp/, and the
  # one place that reasons about macOS path aliasing (import-service's
  # /var -> /private/var realpath handling) is written to be correct on a
  # platform where that aliasing does not exist.
  #
  # Every job here runs on Linux, including `package` — see the note there for
  # what that does and does not still prove.
  gate:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` triggers the postinstall that fetches the Electron binary
      # (~100 MB). setup-node's cache covers ~/.npm but not this, and it is the
      # slowest step in the job by a wide margin.
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - run: npm ci

      # Run separately rather than chained with && so a failure names the step
      # that failed in the UI instead of collapsing into one red block.
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:all
      - run: npm run build

  # Are the two shells still the same application?
  #
  # No dependencies and no build — it reads two git trees and compares text, so
  # it is the cheapest job here by a wide margin and worth running on every
  # push. Drift between the branches is otherwise invisible: both are green,
  # both apps run, and the only symptom is a feature that exists in one build
  # and not the other.
  drift:
    name: Shell drift
    runs-on: ubuntu-latest
    steps:
      # Full history, and both branches: the check compares trees, so a shallow
      # clone of one ref has nothing to compare against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the counterpart branch
        run: git fetch origin main shell/electron --quiet || true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # No `npm ci` — the script uses only node builtins and git, for the same
      # reason the repo-hygiene workflow skips it.
      - run: node .github/scripts/check-shell-drift.mjs

  # The cheap preview: the whole UI as a static bundle, on fixtures. Under a
  # second to build and it needs no Electron at all, so it runs on every pull
  # request regardless of what the rest of the pipeline is doing.
  preview:
    name: Browser preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts skips the Electron binary download. Nothing in the
      # preview build touches Electron, and fetching ~100 MB to run `vite
      # build` for 400ms is most of this job's wall-clock.
      - run: npm ci --ignore-scripts

      - run: npm run build:preview

      # Artifact names cannot contain a forward slash, and every ref that
      # matters here has one: `shell/electron`, `claude/…`, and a pull
      # request's own `17/merge`. GitHub's expression syntax has no replace(),
      # so the substitution happens in the shell.
      - name: Slug for this ref
        id: slug
        run: echo "value=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ui-preview-${{ steps.slug.outputs.value }}
          path: build-preview/
          retention-days: 7
          if-no-files-found: error

      # Publishing to a URL needs Pages turned on for the repository, which is
      # a settings change nobody should discover through a red pipeline — so
      # it is opt-in via a repository variable. Until then the artifact above
      # is the deliverable: download, unzip, open preview.html.
      #
      # For a URL per pull request rather than one for main, publish into a
      # gh-pages branch under pr-<number>/ instead; the official Pages actions
      # deploy a single site per repository, so they cannot express that.
      - name: Upload Pages artifact
        if: vars.ENABLE_PAGES == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-preview/

  deploy-preview:
    name: Publish preview
    runs-on: ubuntu-latest
    needs: preview
    if: vars.ENABLE_PAGES == 'true' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Ubuntu, like everything else here: macOS minutes bill at roughly ten times
  # the Linux rate, and both halves of this job survive the move. The e2e suite
  # launches a real Electron process with real windows — Linux gives it real
  # windows too, under Xvfb — and electron-builder produces a `dir` bundle for
  # whichever platform it is asked for, which is what `verify:package` reads.
  #
  # What this no longer proves: that the app packages AS A MAC APP, and that
  # `npm run build` works on macOS. Both are covered locally by `npm run
  # package`, and neither has ever been the thing this pipeline caught. The
  # shape of the checks is identical; only the target platform changed.
  package:
    name: End-to-end and package
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - run: npm ci

      - run: npm run build

      # Cached separately from the Electron binary above: different store,
      # different cadence. The key is the lockfile, because the browser build
      # a Playwright version wants is pinned by that version.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      # NEW, and easy to mistake for redundant: until `assert-parity.spec.ts`
      # this suite needed no Playwright browser at all. Every other spec drives
      # the app through `_electron`, which launches the BUNDLED Electron binary
      # — so the runner never had a Chromium and never missed one.
      #
      # The parity spec's whole point is to run generated assertions through
      # REAL Playwright against a real page, which is the one thing a model of
      # Playwright's matcher rules cannot do for itself. Skipping it in CI would
      # leave only the model, which is exactly the situation that let "URL
      # contains" ship an assertion that could not pass.
      #
      # `record-then-run.spec.ts` uses it too, via the app's own runner, and
      # skips with an explanation rather than failing if it is ever absent.
      - name: Install Chromium for the parity suite
        run: npx playwright install --with-deps chromium

      # The only tests that boot the app: custom scheme, preload bridge, real
      # windows. jsdom cannot reach any of it, so a break here is invisible to
      # the gate job however green it is.
      #
      # `xvfb-run` because a hosted Linux runner has no display and Electron
      # exits immediately without one — the symptom is a launch timeout that
      # reads like a hung app. ELECTRON_DISABLE_SANDBOX because the runner's
      # kernel restricts unprivileged user namespaces, which the Chromium
      # sandbox needs; the alternative is chowning chrome-sandbox root:root
      # inside node_modules on every run.
      - name: End-to-end suite
        env:
          ELECTRON_DISABLE_SANDBOX: 1
        run: xvfb-run -a npx playwright test --config e2e/playwright.config.ts

      # Traces and screenshots for the failures, which is the whole reason
      # `trace: retain-on-failure` is set. Without this the report dies with
      # the runner and a CI-only failure has to be reproduced blind.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # `--linux` rather than the `--mac` of `npm run package`: a macOS target
      # cannot be built on Linux at all (electron-builder needs the platform's
      # own codesigning and bundle tooling). `dir` on both, so what comes out
      # is the same unpacked tree with the same node_modules inside it — which
      # is the only part `verify:package` below looks at.
      - run: npx electron-builder --linux dir

      # electron-builder reports a dependency tree it could not walk and then
      # exits 0, so its own exit code is not evidence that the bundle is whole.
      # This asks the .app directly whether every runtime dependency resolves
      # inside it. The failure that motivated it cannot happen on this runner —
      # `npm ci` above is a real install — which is the point of running it
      # here anyway: this is the one place the assertion is checked against a
      # bundle that is supposed to pass, so a guard that had started rejecting
      # good builds would show up as a red gate rather than as a local mystery.
      - run: npm run verify:package

      # A tarball rather than handing the tree to upload-artifact directly: the
      # bundle is full of symlinks and the action dereferences them, which both
      # breaks it and multiplies its size. (On macOS this step was `ditto`, for
      # the same reason plus Gatekeeper.) `-h` is deliberately NOT passed —
      # preserving the links is the whole point.
      - name: Archive the bundle
        run: tar -czf good-looks-linux-x64.tar.gz -C dist linux-unpacked

      # Same slash problem as the preview job — see the comment there.
      - name: Slug for this ref
        id: slug
        run: echo "value=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: good-looks-${{ steps.slug.outputs.value }}-linux-x64
          path: good-looks-linux-x64.tar.gz
          # A preview build is interesting while its pull request is open and
          # noise afterwards.
          retention-days: 7
          if-no-files-found: error
