name: Repo hygiene

# The cheap half of CI: repo-level facts checkable with git and node builtins,
# with no `npm install` at all — so this answers in seconds while `gate.yml`
# is still installing.
#
# It used to say the full gate COULD NOT run in CI, because `@glaze/core`
# resolved to a Glaze.app SDK install outside the repo that no hosted runner
# has. That stopped being true when the SDK left: every dependency now comes
# from `npm install`, and `gate.yml` runs lint, type-check, test:all, build,
# the e2e suite and a package on a stock runner. This workflow is kept for
# what it is fast at, not for what the other one cannot do.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # No `npm ci` — installing dependencies proves nothing here and the
      # checks read only tracked files plus the two manifests.
      - name: Check repo hygiene
        run: node .github/scripts/check-repo-hygiene.mjs
